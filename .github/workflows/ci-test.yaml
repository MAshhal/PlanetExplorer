name: Unit Tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Add base url to local.properties
        run: echo "SWAPI_BASE_URL=https://swapi.info/api/" >> local.properties

      - name: Run unit tests
        run: ./gradlew test
